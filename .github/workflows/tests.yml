# The gate of this repository (docs/ci-cd.md of the keel repository):
#   appliance / boot-published-layer   the layer the mirror publishes is
#                                fetched, verified, assembled, booted in LXC
#                                and checked. It is evidence about that
#                                published layer and not about this branch,
#                                which nothing here builds: a pull request
#                                that changes the recipe is not exercised by
#                                it. A layer that has never been published
#                                fails the job instead of passing it.
# The job is gated on the organization variable KEEL_LXC_RUNNER, because a job
# aimed at a label no runner carries stays queued until GitHub cancels it.
name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  appliance:
    if: vars.KEEL_LXC_RUNNER == 'true'
    uses: keel-linux/.github/.github/workflows/test-appliance.yml@main
    with:
      appliance: nodejs-nginx
      parent: core
      timeout: 60
