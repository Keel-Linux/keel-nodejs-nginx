# Forgejo copy of .github/workflows/tests.yml (decision 0056): the same
# jobs, with a runs-on line on each call of a reusable workflow,
# because Forgejo runs a called workflow on the runner of the caller.
# The gate of this repository (docs/ci-cd.md of the keel repository):
#   appliance / build-and-boot   the layer is fetched from the mirror,
#                                verified, assembled, booted in LXC and
#                                checked. It skips with a notice while the
#                                layer is not published, so the gate is in
#                                place before the first build lands.
# The job is gated on the organization variable KEEL_LXC_RUNNER, because a job
# aimed at a label no runner carries stays queued until GitHub cancels it.
name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  appliance:
    if: vars.KEEL_LXC_RUNNER == 'true'
    runs-on: keel-lxc
    uses: keel-linux/.github/.github/workflows/test-appliance.yml@main
    with:
      appliance: nodejs-nginx
      parent: core
      timeout: 60
      # No layer of this appliance is on the mirror yet (decision 0059: it
      # moves to the current stack first). Without this line the job fails
      # on every pull request. The job summary says that nothing was
      # booted, and the exemption becomes an error when the layer is
      # published, so the line then must go.
      allow_unpublished: true
